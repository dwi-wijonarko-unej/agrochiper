# Deploy AgroCipher otomatis ke VPS saat push ke branch main.
#
# Diperlukan secret GitHub (repo Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST     - IP / hostname server
#   DEPLOY_USER     - user SSH di server (biasanya root)
#   DEPLOY_PORT     - port SSH (default 22)
#   DEPLOY_SSH_KEY  - PRIVATE key deploy dalam bentuk BASE64 (agar aman dari
#                     masalah line-ending / whitespace saat copy-paste).
#                     Cara buatnya di server:
#                       base64 -w0 ~/.ssh/id_ed25519
#                     lalu tempel SEMUA output (satu baris panjang) ke secret.
#
# PUBLIC key dari pasangan yang sama harus ada di:
#   /home/<user>/.ssh/authorized_keys  (di server)

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SSH & deploy ke server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "Levari: pastikan secret DEPLOY_HOST & DEPLOY_USER sudah di-set." >&2
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          if ! echo "$DEPLOY_SSH_KEY" | base64 -d > "$HOME/.ssh/deploy_key" 2>/dev/null; then
            echo "Error: DEPLOY_SSH_KEY bukan base64 yang valid." >&2
            echo "       Update secret dengan:  base64 -w0 ~/.ssh/id_ed25519" >&2
            exit 1
          fi
          chmod 600 "$HOME/.ssh/deploy_key"
          if ! grep -q "BEGIN.*PRIVATE KEY" "$HOME/.ssh/deploy_key"; then
            echo "Error: DEPLOY_SSH_KEY bukan PRIVATE key." >&2
            echo "       Sepertinya key publik (.pub) ter-copy. Gunakan:" >&2
            echo "       base64 -w0 ~/.ssh/id_ed25519    (tanpa .pub!)" >&2
            exit 1
          fi
          port="${DEPLOY_PORT:-22}"
          ssh -i "$HOME/.ssh/deploy_key" \
              -o StrictHostKeyChecking=accept-new \
              -p "$port" \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'cd /opt/agrochiper && bash deploy/deploy.sh'