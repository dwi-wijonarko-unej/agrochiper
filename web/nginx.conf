server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gateway health — so https://agrocipher.id/health works
    # (Cloudflare terminates TLS and forwards as http:80 to this container)
    location = /health {
        proxy_pass http://gateway:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gateway API — so https://agrocipher.id/api/v1/* works
    # and analytics.html can use same-origin /api/v1/logs (no :8080).
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Handle CORS preflight at proxy layer (gateway also handles it)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-API-Key, Authorization" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
